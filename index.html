<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルメモ帳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-top: 20px;
        }

        .notes-list {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 600px;
            overflow-y: auto;
        }

        .notes-list h2 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .note-item {
            background: #f7f7f7;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }

        .note-item:hover {
            background: #efefef;
            transform: translateX(5px);
        }

        .note-item.active {
            background: #667eea;
            color: white;
        }

        .note-item h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .note-item p {
            font-size: 0.9rem;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item small {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .editor-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .editor-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1.2rem;
            margin-bottom: 15px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 50px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 シンプルメモ帳</h1>
            <p>メモを作成・編集・保存しましょう</p>
        </header>

        <div class="main-content">
            <div class="notes-list">
                <h2>メモ一覧</h2>
                <button class="btn btn-success" onclick="createNewNote()" style="width: 100%; margin-bottom: 15px;">
                    ➕ 新規メモ
                </button>
                <div id="notesList"></div>
            </div>

            <div class="editor-section">
                <div class="editor-header">
                    <button class="btn btn-primary" onclick="saveNote()">💾 保存</button>
                    <button class="btn btn-danger" onclick="deleteNote()">🗑️ 削除</button>
                </div>
                <div id="editorArea">
                    <div class="empty-state">
                        <h2>メモを選択するか、新規作成してください</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notes = [];
        let currentNoteId = null;

        // ページ読み込み時
        window.onload = function() {
            loadNotes();
            renderNotesList();
        };

        // localStorageからメモを読み込み
        function loadNotes() {
            const stored = localStorage.getItem('notes');
            if (stored) {
                notes = JSON.parse(stored);
            }
        }

        // localStorageにメモを保存
        function saveToStorage() {
            localStorage.setItem('notes', JSON.stringify(notes));
        }

        // メモ一覧を表示
        function renderNotesList() {
            const listContainer = document.getElementById('notesList');
            
            if (notes.length === 0) {
                listContainer.innerHTML = '<div class="empty-state"><p>メモがありません</p></div>';
                return;
            }

            listContainer.innerHTML = notes.map(note => `
                <div class="note-item ${currentNoteId === note.id ? 'active' : ''}" 
                     onclick="selectNote(${note.id})">
                    <h3>${note.title || '無題のメモ'}</h3>
                    <p>${note.content.substring(0, 50)}${note.content.length > 50 ? '...' : ''}</p>
                    <small>${new Date(note.updatedAt).toLocaleString('ja-JP')}</small>
                </div>
            `).join('');
        }

        // 新規メモ作成
        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: '',
                content: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            
            notes.unshift(newNote);
            currentNoteId = newNote.id;
            saveToStorage();
            renderNotesList();
            renderEditor();
        }

        // メモを選択
        function selectNote(id) {
            currentNoteId = id;
            renderNotesList();
            renderEditor();
        }

        // エディタを表示
        function renderEditor() {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) {
                document.getElementById('editorArea').innerHTML = `
                    <div class="empty-state">
                        <h2>メモを選択するか、新規作成してください</h2>
                    </div>
                `;
                return;
            }

            document.getElementById('editorArea').innerHTML = `
                <input type="text" id="noteTitle" placeholder="タイトル" value="${note.title}">
                <textarea id="noteContent" placeholder="ここにメモを入力...">${note.content}</textarea>
            `;
        }

        // メモを保存
        function saveNote() {
            if (!currentNoteId) {
                alert('メモが選択されていません');
                return;
            }

            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;

            const noteIndex = notes.findIndex(n => n.id === currentNoteId);
            if (noteIndex !== -1) {
                notes[noteIndex].title = title;
                notes[noteIndex].content = content;
                notes[noteIndex].updatedAt = new Date().toISOString();
                
                saveToStorage();
                renderNotesList();
                
                alert('保存しました！');
            }
        }

        // メモを削除
        function deleteNote() {
            if (!currentNoteId) {
                alert('メモが選択されていません');
                return;
            }

            if (confirm('本当に削除しますか？')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = null;
                
                saveToStorage();
                renderNotesList();
                renderEditor();
                
                alert('削除しました');
            }
        }
    </script>
</body>
</html>
