<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>全部盛りメモ帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
}
.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}
header {
    color: #fff;
    text-align: center;
    margin-bottom: 20px;
}
.toolbar {
    background: #fff;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.btn {
    border: none;
    border-radius: 5px;
    padding: 8px 14px;
    cursor: pointer;
}
.btn-success { background:#2ecc71;color:#fff }
.btn-info { background:#3498db;color:#fff }
.btn-warning { background:#f39c12;color:#fff }
.btn-danger { background:#e74c3c;color:#fff }

.main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 15px;
    margin-top: 15px;
}
.sidebar, .editor {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
}
.notes-list {
    margin-top: 10px;
    max-height: 500px;
    overflow-y: auto;
}
.note-item {
    background: #f5f5f5;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    border-left: 5px solid #667eea;
}
.note-item.active {
    background: #667eea;
    color: #fff;
}
input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 5px;
    box-sizing: border-box;
}
textarea {
    min-height: 300px;
    margin-top: 10px;
}
.empty {
    text-align: center;
    color: #999;
    padding: 50px;
}
.stats {
    font-size: 12px;
    color: #666;
    margin-top: 5px;
}
@media(max-width:768px){
    .main{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<div class="container">
<header>
    <h1>📝 全部盛りメモ帳</h1>
    <p>完全ローカル / 自動保存</p>
</header>

<div class="toolbar">
    <button class="btn btn-success" onclick="createNewNote()">➕ 新規</button>
    <button class="btn btn-info" onclick="exportNotes()">💾 エクスポート</button>
    <button class="btn btn-warning" onclick="document.getElementById('import').click()">📥 インポート</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑 全削除</button>
    <input type="file" id="import" accept=".json" hidden onchange="importNotes(event)">
</div>

<div class="main">
    <div class="sidebar">
        <input type="text" id="search" placeholder="🔍 検索" oninput="renderList()">
        <div class="notes-list" id="notesList"></div>
    </div>

    <div class="editor">
        <div id="editorArea" class="empty">
            メモを選択するか新規作成してください
        </div>
    </div>
</div>
</div>

<script>
let notes = [];
let currentId = null;

/* ---------- 初期化 ---------- */
window.onload = () => {
    const saved = localStorage.getItem("notes");
    if(saved) notes = JSON.parse(saved);
    renderList();
};

/* ---------- 保存 ---------- */
function save(){
    localStorage.setItem("notes", JSON.stringify(notes));
}

/* ---------- 新規 ---------- */
function createNewNote(){
    const note = {
        id: Date.now(),
        title: "",
        content: "",
        created: new Date().toISOString(),
        updated: new Date().toISOString()
    };
    notes.unshift(note);
    currentId = note.id;
    save();
    renderList();
    renderEditor();
}

/* ---------- 一覧 ---------- */
function renderList(){
    const list = document.getElementById("notesList");
    const word = document.getElementById("search").value.toLowerCase();

    const filtered = notes.filter(n =>
        n.title.toLowerCase().includes(word) ||
        n.content.toLowerCase().includes(word)
    );

    if(filtered.length === 0){
        list.innerHTML = "<div class='empty'>メモなし</div>";
        return;
    }

    list.innerHTML = filtered.map(n => `
        <div class="note-item ${n.id===currentId?'active':''}"
            onclick="selectNote(${n.id})">
            <strong>${n.title || "無題"}</strong><br>
            <small>${new Date(n.updated).toLocaleString()}</small>
        </div>
    `).join("");
}

/* ---------- 選択 ---------- */
function selectNote(id){
    currentId = id;
    renderList();
    renderEditor();
}

/* ---------- 編集 ---------- */
function renderEditor(){
    const note = notes.find(n=>n.id===currentId);
    if(!note) return;

    document.getElementById("editorArea").innerHTML = `
        <input type="text" value="${note.title}"
            placeholder="タイトル"
            oninput="update('title',this.value)">
        <textarea oninput="update('content',this.value)">${note.content}</textarea>
        <div class="stats">
            作成: ${new Date(note.created).toLocaleString()} /
            更新: ${new Date(note.updated).toLocaleString()}
        </div>
    `;
}

function update(field,value){
    const note = notes.find(n=>n.id===currentId);
    if(!note) return;
    note[field]=value;
    note.updated=new Date().toISOString();
    save();
    renderList();
}

/* ---------- エクスポート ---------- */
function exportNotes(){
    const blob = new Blob([JSON.stringify(notes,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "notes.json";
    a.click();
}

/* ---------- インポート ---------- */
function importNotes(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
        notes = JSON.parse(reader.result);
        save();
        currentId=null;
        renderList();
        document.getElementById("editorArea").innerHTML="<div class='empty'>読み込み完了</div>";
    };
    reader.readAsText(file);
}

/* ---------- 全削除 ---------- */
function clearAll(){
    if(confirm("全メモ削除しますか？")){
        notes=[];
        currentId=null;
        save();
        renderList();
        document.getElementById("editorArea").innerHTML="<div class='empty'>削除済み</div>";
    }
}
</script>
</body>
</html>
